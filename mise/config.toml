# No global tool pins.
# Node is pinned per-project instead.
# A global pin here applies in every directory, and if the version is not
# installed mise prints `mise WARN missing: node@N` on every prompt and cd.
# It is also shadowed by the NixOS system node, so it bought nothing.

[settings]
all_compile = false

[tools]
bun = "1.3.9"
