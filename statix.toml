# statix lint config for this repo.
#
# repeated_keys (W20) is disabled: it flags flat dotted paths like
#   services.zfs.autoScrub.enable = true;
#   services.syncthing = { ... };
# and wants them collapsed into one nested `services = { ... }` block. That is
# the wrong shape for a NixOS module - flat paths are the nixpkgs idiom, and
# collapsing them would scatter the commented thematic sections (Boot, Storage,
# Syncthing, ...) that make hosts/nas/default.nix readable.
disabled = [ "repeated_keys" ]

# .direnv is statix's own default; hardware-configuration.nix is generated by
# nixos-generate-config and must not be hand-edited or reformatted.
ignore = [
  ".direnv",
  "hardware-configuration.nix",
]
